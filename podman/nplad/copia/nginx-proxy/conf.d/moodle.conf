# ===============================================
# 1. DEFINICIÓN DE UPSTREAMS
# ===============================================
upstream plad_old_backend {
    server moodle_old:80; 
}
upstream nplad_backend {
    server moodle_new:80;
}
upstream phpmyadmin_backend {
    server phpmyadmin:80;  
}

# ===============================================
# 2. SERVIDOR MOODLE NUEVO (nplad.ufps.edu.co / localhost)
# ===============================================
server {
    listen 80 default_server; 
    
    server_name nplad.ufps.edu.co www.nplad.ufps.edu.co localhost 127.0.0.1 "";

    client_max_body_size 4200M;
    client_body_buffer_size 128k;
    proxy_request_buffering off;
    proxy_buffering off;

    add_header X-Frame-Options "SAMEORIGIN";

    location / {
        proxy_pass http://nplad_backend;
        proxy_http_version 1.1;
        proxy_set_header Host nplad.ufps.edu.co;
        proxy_set_header X-Forwarded-Host nplad.ufps.edu.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # INDICAMOS QUE EL TRÁFICO ES HTTP PLANO
        proxy_set_header X-Forwarded-Proto http; 
        proxy_set_header X-Forwarded-Port 80; 

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_connect_timeout 3600;
        send_timeout 3600;

        proxy_request_buffering off;
        proxy_buffering off;
    }

    location ^~ /phpmyadmin/ {
        proxy_pass http://phpmyadmin_backend/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Port 80;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_connect_timeout 3600;
        send_timeout 3600;

        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 4200M;
    }
    
    error_page 502 503 504 /50x_error.html;
    location = /50x_error.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# ===============================================
# 3. SERVIDOR MOODLE OLD (nplad2.ufps.edu.co)
# ===============================================
server {
    listen 80;
    
    server_name nplad2.ufps.edu.co www.nplad2.ufps.edu.co;

    client_max_body_size 4200M;
    client_body_buffer_size 128k;
    proxy_request_buffering off;
    proxy_buffering off;

    add_header X-Frame-Options "SAMEORIGIN";

    location / {
        proxy_pass http://plad_old_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # INDICAMOS QUE EL TRÁFICO ES HTTP PLANO
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Port 80; 
        
        proxy_redirect off;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_connect_timeout 3600;
        send_timeout 3600;

        proxy_request_buffering off;
        proxy_buffering off;
    }

    error_page 502 503 504 /50x_error.html;
    location = /50x_error.html {
        root /usr/share/nginx/html;
        internal;
    }
}
