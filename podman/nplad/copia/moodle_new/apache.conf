<VirtualHost *:80>
    ServerName nplad.ufps.edu.co
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/moodle_new_error.log
    CustomLog ${APACHE_LOG_DIR}/moodle_new_access.log combined
</VirtualHost>
